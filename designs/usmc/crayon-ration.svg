    <line x1="140" y1="290" x2="860" y2="290" stroke="#E9E1CB" stroke-width="4"/>
    <g transform="translate(0,420)">
      <g transform="rotate(-14 330 420)">
      <g transform="translate(330,0)">
        <rect x="-44" y="0" width="88" height="400" rx="6" fill="#E9E1CB" mask="url(#crayon-ration-cr)"/>
        <path d="M-44,4 L-30,-60 L-10,-104 L10,-104 L30,-60 L44,4 Z" fill="#E9E1CB"/>
      </g></g>
      <g transform="translate(0,-30)">
      <g transform="translate(500,0)">
        <rect x="-44" y="0" width="88" height="400" rx="6" fill="#B5202E" mask="url(#crayon-ration-cr)"/>
        <path d="M-44,4 L-30,-60 L-10,-104 L10,-104 L30,-60 L44,4 Z" fill="#B5202E"/>
      </g></g>
      <g transform="rotate(14 670 420)">
      <g transform="translate(670,0)">
        <rect x="-44" y="0" width="88" height="400" rx="6" fill="#E9E1CB" mask="url(#crayon-ration-cr)"/>
        <path d="M-44,4 L-30,-60 L-10,-104 L10,-104 L30,-60 L44,4 Z" fill="#E9E1CB"/>
      </g></g>
    </g>
    <line x1="140" y1="880" x2="860" y2="880" stroke="#E9E1CB" stroke-width="4"/>
    <g font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="38" fill="#E9E1CB" letter-spacing="3">
